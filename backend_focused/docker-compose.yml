services:
  backend:
    image: fleet-maintenance-backend
    build:
      context: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-true}"
      DJANGO_LOG_SQL: "${DJANGO_LOG_SQL:-true}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health/', timeout=2)
      interval: 10s
      timeout: 2s
      retries: 6
      start_period: 5s

  locust:
    image: fleet-maintenance-backend
    profiles:
      - load-test
    command: >
      locust --locustfile load_tests/locustfile.py
      --host http://backend:8000
    environment:
      LOCUST_MAX_FAILURE_RATIO: "0.01"
      LOCUST_MAX_P95_MS: "1000"
      LOCUST_USERNAME: "${LOCUST_USERNAME:-}"
      LOCUST_PASSWORD: "${LOCUST_PASSWORD:-}"
    volumes:
      - ./backend:/app
    ports:
      - "8089:8089"
    depends_on:
      backend:
        condition: service_healthy
